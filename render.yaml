databases:
  - name: labnexus-db
    databaseName: labnexus
    user: labnexus
    plan: free

services:
  - type: web
    name: labnexus-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix apps/api && npm run db:generate --prefix apps/api && npm run db:deploy --prefix apps/api && npm run build:api
    startCommand: npm run start --prefix apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: labnexus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: labnexus-web
    runtime: static
    buildCommand: npm ci --prefix apps/web && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
